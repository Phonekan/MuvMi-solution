      case 'restart': state = { screen: 'trip', detail: 'muv10', pending: 'muv10', applied: null, filter: 'all', code: '', errL1: '', errL2: '', errDetail: false, booked: false }; render(); break;
    }
  });
  app.addEventListener('input', function (e) {
    if (e.target.id !== 'promo-input') return;
    state.code = e.target.value;
    var b = document.getElementById('code-btn'); if (b) b.classList.toggle('active', !!state.code);
  });
  app.addEventListener('submit', function (e) {
    e.preventDefault();
    var c = (state.code || '').trim().toUpperCase();
    if (!c) return;
    if (c === 'MUV10') set({ pending: 'muv10', screen: 'check', errL1: '' });
    else if (c === 'RIDE20') set({ errL1: 'โค้ดนี้ไม่ตรงตามเงื่อนไข', errL2: 'ยอดขั้นต่ำ 200 ฿ (ทริปนี้ 154 ฿)', errDetail: true });
    else set({ errL1: 'ไม่พบโค้ด "' + c + '"', errL2: 'กรุณาตรวจสอบตัวสะกดอีกครั้ง', errDetail: false });
  });

  render();
})();
</script>
</body>
</html>
